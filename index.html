<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منصة المجتهد التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10302b;--bg:#f3f6f4;--line:#d6e1db;--mint:#1f7a63;--gold:#e0a21b;--red:#b83227;--mut:#5b6f68}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 40px}
.hero{background:var(--ink);color:#fff;padding:44px 20px 36px;text-align:center}
.hero .mark{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:34px;font-weight:800;display:grid;place-items:center}
.hero h1{margin:0 0 6px;font-size:30px;font-weight:800}.hero p{margin:0;color:#bcd3cb}
.roles{display:grid;gap:12px;margin-top:20px}
.role{all:unset;cursor:pointer;display:block;background:#fff;border:1px solid var(--line);border-right:6px solid var(--mint);border-radius:10px;padding:16px 18px}
.role:nth-child(2){border-right-color:var(--gold)}.role:nth-child(3){border-right-color:var(--ink)}
.role b{display:block;font-size:19px}.role span{color:var(--mut);font-size:14px}.role:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.top h2{margin:0;font-size:18px}
button,.btn{font-family:inherit;cursor:pointer;border:0;border-radius:8px;background:var(--mint);color:#fff;padding:10px 16px;font-size:15px;font-weight:700;text-decoration:none;display:inline-block}
.sm{padding:5px 10px;font-size:13px;margin:2px}.bad{background:var(--red)}.ghost{background:transparent;border:1px solid #fff}.gold{background:var(--gold);color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
.card h3{margin:0 0 12px}label{display:block;font-size:14px;font-weight:500;margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:16px}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff}
.bar{background:#fff7e0;border:1px solid #f0d58a;border-radius:8px;padding:10px 12px;margin-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
code{direction:ltr;background:#fff;padding:2px 6px;border-radius:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{background:#e8f0ec}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}.stats div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.stats b{display:block;font-size:22px}
.empty{color:var(--mut);padding:14px 0}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.back{background:none;color:var(--mut);padding:8px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;transition:.25s;z-index:9;max-width:90%}#toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script>
const DB='https://manasa2026-default-rtdb.firebaseio.com/';
const ADMIN={u:'admin',p:'admin2026'}; /* غيّر بيانات الأدمن من هنا */
const GOV=['القاهرة','الجيزة','الإسكندرية','القليوبية','الشرقية','الدقهلية','البحيرة','المنوفية','الغربية','كفر الشيخ','دمياط','بورسعيد','الإسماعيلية','السويس','شمال سيناء','جنوب سيناء','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد','مطروح'];
const STG=['تأسيس','ابتدائي','إعدادي','ثانوي','تجاري','تعليم جامعي','تعليم عالي','أزهري'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=o=>Object.entries(o||{}).map(([id,v])=>({id,...v}));
const money=n=>(n||0).toLocaleString('ar-EG');
const tot=x=>(+x.count||0)*(+x.price||0);
const val=id=>$('#'+id).value.trim();
const opt=(a,ph)=>`<option value="">${ph}</option>`+a.map(x=>`<option>${x}</option>`).join('');
const fld=(id,l,t='text',x='')=>`<label>${l}<input id="${id}" type="${t}" ${x}></label>`;
const wa=(ph,m)=>'https://wa.me/'+String(ph||'').replace(/\D/g,'').replace(/^0/,'20')+'?text='+encodeURIComponent(m);
const J=(p,m,b)=>fetch(DB+p+'.json',{method:m,body:b===undefined?undefined:JSON.stringify(b)}).then(r=>{if(!r.ok)throw 0;return r.json()});
const get=p=>J(p,'GET'),put=(p,v)=>J(p,'PUT',v),push=(p,v)=>J(p,'POST',v),patch=(p,v)=>J(p,'PATCH',v),del=p=>J(p,'DELETE');
const S={v:'home',tab:'',u:null,d:{},f:{},pc:0};
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3000)}
function go(v,tab=''){S.v=v;S.tab=tab;S.f={};render()}
function out(){S.u=null;go('home')}
async function load(){try{const k=['teachers','students','sessions','payments','content'];const r=await Promise.all(k.map(get));S.d={t:r[0],s:r[1],se:r[2],p:r[3],c:r[4]};S.pc=arr(r[0]).filter(x=>x.status==='pending').length}catch(e){toast('تعذر الاتصال بقاعدة البيانات، تحقق من الإنترنت')}render()}
async function enter(v,tab){S.v=v;S.tab=tab;S.f={};await load()}
const head=t=>`<div class="top"><h2>${t}</h2><button class="sm ghost" onclick="out()">خروج</button></div>`;
const tabs=l=>`<div class="tabs">${l.map(x=>`<button class="${S.tab===x[0]?'on':''}" onclick="S.tab='${x[0]}';S.f={};render()">${x[1]}</button>`).join('')}</div>`;
const form=(t,b,back='home')=>`<div class="hero" style="padding:24px"><h1 style="font-size:22px">منصة المجتهد</h1></div><div class="wrap"><button class="back" onclick="go('${back}')">الرجوع للرئيسية</button><div class="card" style="margin-top:0"><h3>${t}</h3>${b}</div></div>`;
const V={
home:()=>`<div class="hero"><div class="mark">م</div><h1>منصة المجتهد التعليمية</h1><p>المدرس والطالب وولي الأمر في مكان واحد</p></div><div class="wrap"><div class="roles">
<button class="role" onclick="go('la')"><b>الأدمن</b><span>اعتماد المدرسين والجداول والحسابات</span></button>
<button class="role" onclick="go('lt')"><b>المدرس</b><span>الطلاب والملفات والحصص</span></button>
<button class="role" onclick="go('lp')"><b>ولي الأمر / الطالب</b><span>ادخل بكود الطالب لمتابعة الدروس</span></button></div></div>`,
la:()=>form('دخول الأدمن',fld('au','اسم المستخدم')+fld('ap','كلمة المرور','password')+`<button onclick="loginA()">دخول</button>`),
lt:()=>form('دخول المدرس',fld('ti','الهاتف أو البريد')+fld('tw','كلمة السر','password')+`<button onclick="loginT()">دخول</button> <button class="back" onclick="go('reg')">تسجيل حساب مدرس جديد</button>`),
reg:()=>form('تسجيل مدرس جديد','<p class="empty" style="margin-top:0">يتم تفعيل حسابك بعد موافقة الأدمن.</p><div class="g2">'+fld('rn','الاسم الكامل')+fld('rp','الهاتف','tel')+fld('re','البريد (اختياري)','email')+`<label>المحافظة<select id="rg">${opt(GOV,'اختر المحافظة')}</select></label><label>المرحلة<select id="rs">${opt(STG,'اختر المرحلة')}</select></label>`+fld('rj','المادة التي تدرّسها')+fld('rx','سنوات الخبرة','number','min="0"')+fld('rw','كلمة السر (6 أحرف على الأقل)','password')+`</div><button onclick="regT()">إرسال طلب التسجيل</button> <button class="back" onclick="go('lt')">لدي حساب بالفعل</button>`,'lt'),
lp:()=>form('دخول ولي الأمر / الطالب',fld('pc','كود الطالب','text','inputmode="numeric" maxlength="6"')+`<button onclick="loginP()">عرض الدروس</button>`),
admin:()=>{const pd=arr(S.d.t).filter(x=>x.status==='pending');
return head('لوحة الأدمن')+`<div class="wrap"><div class="bar"><span>رابط تسجيل المدرسين:</span><code id="rl">${esc(location.origin)}/?reg=1</code><button class="sm gold" onclick="navigator.clipboard.writeText($('#rl').textContent).then(()=>toast('تم نسخ الرابط'))">نسخ</button></div>`+
tabs([['teachers','المدرسون'],['pending','الطلبات المعلقة'+(pd.length?' ('+pd.length+')':'')],['sess','جدول الحصص'],['acc','الحسابات']])+AT[S.tab||'teachers']()+`</div>`},
teacher:()=>{const me=arr(S.d.t).find(x=>x.id===S.u.id)||{};
return head('أهلًا أستاذ '+esc(me.name))+`<div class="wrap">`+tabs([['st','الطلاب والأكواد'],['ct','الملفات والفيديوهات'],['se','الحصص والحساب']])+TT[S.tab||'st'](me)+`</div>`},
parent:()=>{const s=S.u.s,t=arr(S.d.t).find(x=>x.id===s.tid)||{};
const c=arr(S.d.c).filter(x=>x.tid===s.tid&&(!x.group||x.group===s.group));
return head('أهلًا '+esc(s.name))+`<div class="wrap"><div class="card"><h3>المدرس: ${esc(t.name||'—')}</h3><p style="margin:0;color:var(--mut)">${esc(t.subject||'')}</p></div><div class="card"><h3>الشروحات والملفات</h3>${c.length?c.map(x=>`<div class="item"><span><b>${esc(x.title)}</b> <small>(${esc(x.type)})</small></span><a class="btn sm" href="${esc(x.url)}" target="_blank" rel="noopener">فتح</a></div>`).join(''):'<p class="empty">لم يرفع المدرس أي ملفات بعد.</p>'}</div></div>`}
};
const AT={
teachers:()=>`<div class="card"><div class="g2"><label>بحث بالاسم أو المادة<input oninput="S.f.q=this.value;drawT()"></label><label>المحافظة<select onchange="S.f.g=this.value;drawT()">${opt(GOV,'كل المحافظات')}</select></label><label>نوع الحصص<select onchange="S.f.ty=this.value;drawT()"><option value="">الكل</option><option value="private">خاصة</option><option value="group">مجموعات</option></select></label></div><div id="tt"></div></div>`,
pending:()=>{const p=arr(S.d.t).filter(x=>x.status==='pending');return `<div class="card"><h3>طلبات قيد الموافقة</h3>${p.length?p.map(x=>`<div class="item"><span><b>${esc(x.name)}</b><br><small>${esc(x.phone)} — ${esc(x.gov)} — ${esc(x.stage)} / ${esc(x.subject)} — خبرة ${esc(x.exp||0)} سنة</small></span><span><button class="sm" onclick="setSt('${x.id}','approved')">موافقة</button><button class="sm bad" onclick="setSt('${x.id}','rejected')">رفض</button></span></div>`).join(''):'<p class="empty">لا توجد طلبات جديدة. أرسل رابط التسجيل للمدرسين.</p>'}</div>`},
sess:()=>`<div class="card"><div class="g2"><label>اليوم<input type="date" onchange="S.f.d=this.value;drawS()"></label><label>المحافظة<select onchange="S.f.g=this.value;drawS()">${opt(GOV,'كل المحافظات')}</select></label></div><div id="ss"></div></div>`,
acc:()=>{const T=arr(S.d.t).filter(x=>x.status==='approved');return `<div class="card"><h3>حسابات المدرسين</h3>${T.length?`<div class="tw"><table><tr><th>المدرس</th><th>الحصص</th><th>المستحق</th><th>المدفوع</th><th>المتبقي</th><th></th></tr>${T.map(x=>{const a=acct(x.id);return `<tr><td>${esc(x.name)}</td><td>${a.se.length}</td><td>${money(a.due)}</td><td>${money(a.paid)}</td><td><b>${money(a.rem)}</b></td><td><button class="sm" onclick="pay('${x.id}')">تسجيل دفعة</button></td></tr>`}).join('')}</table></div>`:'<p class="empty">لا يوجد مدرسون معتمدون بعد.</p>'}</div>`}
};
const TT={
st:me=>{const L=arr(S.d.s).filter(x=>x.tid===me.id);return `<div class="card"><h3>إضافة طالب وإصدار كود</h3><div class="g2">${fld('sn','اسم الطالب')}${fld('sp','هاتف ولي الأمر','tel')}${fld('sg','المجموعة')}</div><button onclick="addSt()">إضافة وإصدار كود</button></div><div class="card"><h3>طلابي (${L.length})</h3>${L.length?`<div class="tw"><table><tr><th>الكود</th><th>الاسم</th><th>ولي الأمر</th><th>المجموعة</th><th></th></tr>${L.map(x=>`<tr><td><b>${x.id}</b></td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.group)}</td><td><a class="btn sm gold" target="_blank" href="${wa(x.phone,'كود الطالب '+x.name+' على منصة المجتهد: '+x.id+'\n'+location.origin)}">إرسال الكود</a><button class="sm bad" onclick="rm('students/${x.id}','حذف الطالب؟')">حذف</button></td></tr>`).join('')}</table></div>`:'<p class="empty">أضف أول طالب ليظهر هنا كوده.</p>'}</div>`},
ct:me=>{const L=arr(S.d.c).filter(x=>x.tid===me.id);return `<div class="card"><h3>رفع درس أو ملف</h3><p class="empty" style="margin:0 0 10px">ارفع الفيديو أو الملف على YouTube أو Google Drive وألصق رابطه هنا.</p><div class="g2">${fld('cn','عنوان الدرس')}<label>النوع<select id="cy"><option>فيديو</option><option>ملف PDF</option><option>مذكرة</option></select></label>${fld('cu','الرابط','url','dir="ltr"')}${fld('cg','المجموعة (اتركها فارغة لكل الطلاب)')}</div><button onclick="addC()">نشر</button></div><div class="card"><h3>المنشور</h3>${L.length?L.map(x=>`<div class="item"><span><b>${esc(x.title)}</b> <small>${esc(x.type)}${x.group?' — '+esc(x.group):''}</small></span><button class="sm bad" onclick="rm('content/${x.id}','حذف هذا العنصر؟')">حذف</button></div>`).join(''):'<p class="empty">لم تنشر شيئًا بعد.</p>'}</div>`},
se:me=>{const a=acct(me.id);return `<div class="stats"><div>الحصص<b>${a.se.length}</b></div><div>المستحق<b>${money(a.due)}</b></div><div>المستلم<b>${money(a.paid)}</b></div><div>المتبقي<b>${money(a.rem)}</b></div></div><div class="card"><h3>إضافة حصة</h3><div class="g2">${fld('xd','التاريخ','date')}<label>النوع<select id="xt"><option value="private">خاصة</option><option value="group">مجموعة</option></select></label>${fld('xg','اسم المجموعة')}${fld('xl','المكان')}${fld('xc','عدد الطلاب','number','min="1"')}${fld('xp','سعر الطالب','number','min="0"')}</div><button onclick="addSe()">إضافة الحصة</button></div><div class="card"><h3>جدول حصصي</h3>${a.se.length?`<div class="tw"><table><tr><th>التاريخ</th><th>النوع</th><th>المجموعة</th><th>المكان</th><th>الطلاب</th><th>السعر</th><th>الإجمالي</th><th></th></tr>${a.se.sort((x,y)=>x.date<y.date?-1:1).map(s=>`<tr><td>${esc(s.date)}</td><td>${s.type==='private'?'خاصة':'مجموعة'}</td><td>${esc(s.group)}</td><td>${esc(s.place)}</td><td>${s.count}</td><td>${money(s.price)}</td><td>${money(tot(s))}</td><td><button class="sm bad" onclick="rm('sessions/${s.id}','حذف الحصة؟')">حذف</button></td></tr>`).join('')}</table></div>`:'<p class="empty">لا توجد حصص مسجلة.</p>'}</div><div class="card"><h3>المبالغ المستلمة</h3>${a.p.length?a.p.map(x=>`<div class="item"><span>${esc(x.date)}</span><b>${money(x.amount)}</b></div>`).join(''):'<p class="empty">لم تُسجل أي دفعات بعد.</p>'}</div>`}
};
function acct(id){const se=arr(S.d.se).filter(s=>s.tid===id),p=arr(S.d.p).filter(x=>x.tid===id).sort((a,b)=>a.date<b.date?1:-1);const due=se.reduce((a,s)=>a+tot(s),0),paid=p.reduce((a,x)=>a+(+x.amount||0),0);return{se,p,due,paid,rem:due-paid}}
function drawT(){const f=S.f,se=arr(S.d.se);let T=arr(S.d.t).filter(x=>x.status==='approved');
if(f.q)T=T.filter(x=>(x.name+' '+x.subject).includes(f.q));if(f.g)T=T.filter(x=>x.gov===f.g);if(f.ty)T=T.filter(x=>se.some(s=>s.tid===x.id&&s.type===f.ty));
$('#tt').innerHTML=T.length?`<div class="tw"><table><tr><th>المدرس</th><th>الهاتف</th><th>المحافظة</th><th>المرحلة / المادة</th><th>الخبرة</th><th></th></tr>${T.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.gov)}</td><td>${esc(x.stage)} / ${esc(x.subject)}</td><td>${esc(x.exp||0)}</td><td><a class="btn sm gold" target="_blank" href="${wa(x.phone,'')}">واتساب</a><button class="sm bad" onclick="rm('teachers/${x.id}','حذف المدرس؟')">حذف</button></td></tr>`).join('')}</table></div>`:'<p class="empty">لا يوجد مدرسون مطابقون.</p>'}
function drawS(){const f=S.f,T=Object.fromEntries(arr(S.d.t).map(x=>[x.id,x]));let L=arr(S.d.se).filter(s=>T[s.tid]);
if(f.d)L=L.filter(s=>s.date===f.d);if(f.g)L=L.filter(s=>T[s.tid].gov===f.g);L.sort((a,b)=>a.date<b.date?-1:1);
$('#ss').innerHTML=L.length?`<div class="tw"><table><tr><th>التاريخ</th><th>المدرس</th><th>الهاتف</th><th>المحافظة</th><th>النوع</th><th>المكان</th><th>الطلاب</th><th>الإجمالي</th><th></th></tr>${L.map(s=>{const t=T[s.tid],ty=s.type==='private'?'خاصة':'مجموعة '+(s.group||'');return `<tr><td>${esc(s.date)}</td><td>${esc(t.name)}</td><td>${esc(t.phone)}</td><td>${esc(t.gov)}</td><td>${esc(ty)}</td><td>${esc(s.place)}</td><td>${s.count}</td><td>${money(tot(s))}</td><td><a class="btn sm gold" target="_blank" href="${wa(t.phone,'تذكير: لديك حصة '+ty+' بتاريخ '+s.date+' في '+(s.place||''))}">تذكير</a></td></tr>`}).join('')}</table></div>`:'<p class="empty">لا توجد حصص لهذا الاختيار.</p>'}
function render(){$('#app').innerHTML=V[S.v]();if(S.v==='admin'){const t=S.tab||'teachers';if(t==='teachers')drawT();if(t==='sess')drawS()}}
async function act(fn,ok){try{await fn();if(ok)toast(ok);await load()}catch(e){toast('تعذر تنفيذ العملية، حاول مرة أخرى')}}
function loginA(){if(val('au')===ADMIN.u&&val('ap')===ADMIN.p){S.u={role:'admin'};enter('admin','teachers')}else toast('بيانات الأدمن غير صحيحة')}
async function loginT(){const id=val('ti'),pw=val('tw');if(!id||!pw)return toast('أدخل الهاتف وكلمة السر');
try{const t=arr(await get('teachers')).find(x=>(x.phone===id||(x.email&&x.email===id))&&x.pass===pw);
if(!t)return toast('بيانات الدخول غير صحيحة');if(t.status==='pending')return toast('حسابك قيد المراجعة من الأدمن');if(t.status==='rejected')return toast('تم رفض طلب التسجيل');
S.u={role:'teacher',id:t.id};enter('teacher','st')}catch(e){toast('تعذر الاتصال بقاعدة البيانات')}}
